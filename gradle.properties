# JVM memory for Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
# AndroidX
android.useAndroidX=true
# Non-transitive R classes keep builds fast and small
android.nonTransitiveRClass=true
# Kotlin code style
kotlin.code.style=official
# Enable configuration cache
org.gradle.configuration-cache=true

# targetSdk/compileSdk = 36 (Android 16). AGP 8.8.2 is "tested up to
# compileSdk 35", so the tooling emits a warning about compiling against an SDK
# it does not know yet. The build is verified green on 36 (CI builds the signed
# release APK on every push), so the warning is suppressed deliberately.
#
# F11: this comment used to say AGP 8.7.3 while the version catalog said 8.8.2 —
# three different AGP versions were named across the build files.
android.suppressUnsupportedCompileSdk=36
