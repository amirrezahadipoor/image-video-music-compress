# JVM memory for Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
# AndroidX
android.useAndroidX=true
# Non-transitive R classes keep builds fast and small
android.nonTransitiveRClass=true
# Kotlin code style
kotlin.code.style=official
# Enable configuration cache
org.gradle.configuration-cache=true

# targetSdk/compileSdk = 36 (Android 16, upgrade recommendation #2). AGP 8.7.3 is
# "tested up to compileSdk 35" and emits a warning; the build is verified green
# on 36, so suppress the tooling-only warning (kept pinned to AGP 8.7.3 for
# stability — see the Lint disable workaround for its Kotlin-2.x UAST note).
android.suppressUnsupportedCompileSdk=36
