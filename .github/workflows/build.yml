name: Build & Test Bazaar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # One place to change the JVM sizing for every job.
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
    -Dorg.gradle.workers.max=2 -Dfile.encoding=UTF-8
  BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}

jobs:
  # ── Bazaar build only ─────────────────────────────────────────────────
  # NO-PLAY-FIX: this app is published on Café Bazaar (Poolakey billing +
  # Adivery ads). The "play" flavor has no store billing and is only used for
  # local debugging, so the CI deliberately produces NO Google-Play APK —
  # only the signed Bazaar APK is built and uploaded.
  build:
    name: Test + Build signed Bazaar APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 1. JVM unit tests (bazaar/debug so the Poolakey source set is
      #    compiled and validated too). The suite is pure-JVM.
      - name: Run JVM unit tests
        run: |
          ./gradlew \
            :app:testBazaarDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

      # ── 2. Build the Bazaar release APK ────────────────────────────────
      - name: Build Bazaar release APK
        run: |
          ./gradlew \
            :app:assembleBazaarRelease \
            --no-daemon \
            --stacktrace

      # ── 3. Verify signature + warn if the RSA key secret is missing ────
      - name: Verify APK signature
        run: |
          set -e
          APK="app/build/outputs/apk/bazaar/release/app-bazaar-release.apk"
          ls -lh "$APK"
          $JAVA_HOME/bin/jarsigner -verify -verbose "$APK" 2>&1 | \
            grep -E "jar verified|WARNING|ERROR" || true
          if [ -z "$BAZAAR_RSA_KEY" ]; then
            echo "::warning::BAZAAR_RSA_KEY secret is empty — Poolakey will refuse purchases at runtime (by design)."
          fi

      # ── 4. Collect artifacts ───────────────────────────────────────────
      - name: Collect APK artifact
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          BUILD_NUM="${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk \
             "dist/Hajmino-${VERSION}-build${BUILD_NUM}-bazaar.apk"
          ls -lh dist/
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      # ── 5. Upload ──────────────────────────────────────────────────────
      - name: Upload Bazaar APK
        uses: actions/upload-artifact@v6
        with:
          name: compressly-apks-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ── Emulator smoke test ────────────────────────────────────────────────
  # The only test that exercises the REAL MediaCodec pipeline (encoder
  # negotiation, the surface path, the muxer) — the JVM suite cannot reach
  # any of it. Independent from the APK build so a flaky emulator never
  # blocks delivery, but it runs on every push and reports red when the
  # engine breaks on an actual Android runtime.
  instrumented:
    name: Emulator smoke test (real encode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedBazaarDebugAndroidTest --no-daemon
  # ── Baseline Profile — measured on a real Android runtime ──────────────
  # Generates app/src/main/generated/baselineProfiles/ on a Gradle-managed
  # emulator (aosp, rootable) and uploads it as an artifact. Commit the
  # uploaded profile to ship it: subsequent release builds then AOT-compile
  # the startup path (Android 12+ applies it at install time; older devices
  # via ProfileInstaller). Never blocks the Bazaar build above.
  baseline-profile:
    name: Generate Baseline Profile (managed device)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate Baseline Profile
        run: |
          ./gradlew :app:generateBaselineProfile --no-daemon --stacktrace \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload generated Baseline Profile
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles/
          if-no-files-found: error

