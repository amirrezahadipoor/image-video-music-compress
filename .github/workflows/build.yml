name: Build & Test Bazaar APK

on:
  push:
    # CI-ON-BRANCH: `push` was limited to main, so a long-lived fix branch was
    # never built until it landed — the opposite of what a build gate is for.
    # fix/** is the prefix this repo uses for audit branches.
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

# Concurrency: a push to main that also has an open PR used to start two full
# builds of the same commit at once, and both were allowed to run to the end —
# double minutes for one identical result. Grouping on the SHA serialises them.
# cancel-in-progress stays false on purpose: the run that finishes uploads the
# signed APK that the Bazaar release is made from, and a cancelled run leaves
# nothing behind.
concurrency:
  group: build-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  # One place to change the JVM sizing for every job.
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
    -Dorg.gradle.workers.max=2 -Dfile.encoding=UTF-8
  BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
  # Adivery ids are configuration (ADIDS-DEFAULT-FIX): blank unless set, which
  # disables the banner with a loud log instead of serving someone else's units.
  ADIVERY_APP_ID: ${{ secrets.ADIVERY_APP_ID }}
  ADIVERY_BANNER_ID: ${{ secrets.ADIVERY_BANNER_ID }}
  # SIGNING: the release signing keystore + credentials come only from repo
  # secrets (the old committed .jks is COMPROMISED and removed). Exposed to
  # every job so `assembleBazaarRelease` can sign regardless of which job runs;
  # debug/lint/test jobs simply ignore them (build.gradle.kts populates the
  # signing config only when all four are present).
  COMPRESSLY_KEYSTORE_BASE64: ${{ secrets.COMPRESSLY_KEYSTORE_BASE64 }}
  COMPRESSLY_KEYSTORE_PASSWORD: ${{ secrets.COMPRESSLY_KEYSTORE_PASSWORD }}
  COMPRESSLY_KEY_ALIAS: ${{ secrets.COMPRESSLY_KEY_ALIAS }}
  COMPRESSLY_KEY_PASSWORD: ${{ secrets.COMPRESSLY_KEY_PASSWORD }}
  # KI#13 (CERT-PIN): optional pin of the signing certificate's SHA-256.
  # Verified when set, warned about (not silently ignored) when not.
  COMPRESSLY_CERT_SHA256: ${{ secrets.COMPRESSLY_CERT_SHA256 }}

jobs:
  # ── Bazaar build only ─────────────────────────────────────────────────
  # NO-PLAY-FIX: this app is published on Café Bazaar (Poolakey billing +
  # Adivery ads). The "play" flavor has no store billing and is only used for
  # local debugging, so the CI deliberately produces NO Google-Play APK —
  # only the signed Bazaar APK is built and uploaded.
  build:
    name: Test + Build signed Bazaar APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 1. JVM unit tests — the FULL suite, emulator-free. Every variant is
      #    exercised (play + bazaar × debug + release) so the bazaar/Poolakey
      #    source set, the play source set and the release proguard compilation
      #    are all validated. `--continue` keeps the rest of the suite running
      #    after any single variant fails, so one broken test never masks the
      #    others. The suite is pure-JVM (no device needed).
      - name: Run full JVM unit test suite
        run: |
          ./gradlew \
            :app:testPlayDebugUnitTest \
            :app:testBazaarDebugUnitTest \
            :app:testPlayReleaseUnitTest \
            :app:testBazaarReleaseUnitTest \
            --continue \
            --no-daemon \
            --stacktrace

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload test XML on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-xml
          path: app/build/test-results/
          retention-days: 7

      # i18n key parity: every FA key has an EN counterpart and vice versa,
      # no blanks, no duplicate keys (static check on the real source files).
      # NOTE: I18nSanityTest also exists and now runs in the device-tests job,
      # but this static gate is the one that runs on every push (no emulator).
      # G2 (FORMAT-GATE): parity alone is not enough — a `%1$d%` or a `٪` in a
      # format string parses fine, keeps its key, and throws
      # UnknownFormatConversionException at runtime. tools/string_format_check.py
      # tokenises every format string; it is also the script that proved the fix.
      - name: i18n key parity (fa <-> en)
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          def keys(path):
              root = ET.parse(path).getroot()
              ks = {}
              for s in root.findall("string"):
                  name = s.get("name")
                  assert name not in ks, f"duplicate key: {name}"
                  value = "".join(s.itertext()).strip()
                  assert value, f"blank value: {name}"
                  ks[name] = value
              return ks
          fa = keys("app/src/main/res/values/strings.xml")
          en = keys("app/src/main/res/values-en/strings.xml")
          only_fa = sorted(set(fa) - set(en))
          only_en = sorted(set(en) - set(fa))
          assert not only_fa and not only_en, f"fa-only={only_fa} en-only={only_en}"
          print(f"i18n parity OK: {len(fa)} keys in both languages")
          PY

      # G2: every %-conversion in every string must be valid for Java's Formatter.
      - name: i18n format strings (Android Formatter)
        run: python3 tools/string_format_check.py app/src/main/res

      # ── 2. Materialise the signing keystore (from the base64 secret) so the
      #       release APK can be signed. The keystore + credentials are never in
      #       git; they come only from repo secrets. If the secret is missing the
      #       release build fails loudly (no fallback).
      # E1 (FAIL-LOUD-SIGNING): this used to print a warning and carry on, so a
      # missing secret produced an UNSIGNED artifact that only failed later, in
      # the "Collect APK" step, with an unrelated message. A release build
      # without a key is not a release build.
      #
      # SIGNING-MODES: "any missing secret = red build" made every fork, every
      # contributor PR and every repo without secrets permanently red, which
      # teaches people to ignore CI. The real hazard is a *silently unsigned
      # release artifact*, so the check is all-or-nothing and the fallback is
      # explicit instead of accidental:
      #   all four secrets -> signed bazaar release (what a release needs)
      #   none of them     -> debug APK only, and the job says so
      #   some of them     -> hard failure (half a keystore is a bug)
      - name: Check signing secrets
        run: |
          set -euo pipefail
          present=0
          for v in COMPRESSLY_KEYSTORE_BASE64 COMPRESSLY_KEYSTORE_PASSWORD \
                   COMPRESSLY_KEY_ALIAS COMPRESSLY_KEY_PASSWORD; do
            if [ -n "${!v:-}" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 4 ]; then
            echo "SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "signing: all four secrets present — building a signed release"
          elif [ "$present" -eq 0 ]; then
            echo "SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::notice::No signing secrets configured: this run produces a DEBUG APK only and must not be published."
          else
            echo "::error::$present of 4 signing secrets are set — a partially configured keystore is always a mistake (one empty variable makes the signature fall back silently)."
            exit 1
          fi

      # ── 2b. Materialise the keystore (signed mode only) ────────────────
      - name: Materialise signing keystore
        if: env.SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/compressly"
          echo "$COMPRESSLY_KEYSTORE_BASE64" | base64 -d > "$HOME/.gradle/compressly/hajmino-signing.jks"
          echo "COMPRESSLY_KEYSTORE_FILE=$HOME/.gradle/compressly/hajmino-signing.jks" >> "$GITHUB_ENV"
          echo "signing keystore materialised: $(stat -c%s "$HOME/.gradle/compressly/hajmino-signing.jks") bytes"

      # ── 3. Build the Bazaar release APK ────────────────────────────────
      # E8 (ORPHAN-MODULES): :baselineprofile and :benchmark are part of the
      # build but no CI job ever touched them, so they could rot silently while
      # app/build.gradle.kts claimed a dedicated CI job existed. Configuring them
      # is cheap and catches a broken module immediately; generating the actual
      # profile still needs an emulator (see the device job below).
      - name: Configure baseline-profile and benchmark modules
        run: |
          ./gradlew \
            :baselineprofile:tasks \
            :benchmark:tasks \
            --all --no-daemon --quiet > /dev/null

      - name: Build Bazaar release APK
        if: env.SIGNING_ENABLED == 'true'
        run: |
          ./gradlew \
            :app:assembleBazaarRelease \
            --no-daemon \
            --stacktrace

      # SIGNING-MODES fallback: there is no key material in this run, so nothing
      # here may be called a release. The debug APK is still built and uploaded
      # because it is what the device jobs install.
      - name: Build Bazaar debug APK (signing not configured)
        if: env.SIGNING_ENABLED != 'true'
        run: |
          ./gradlew \
            :app:assembleBazaarDebug \
            --no-daemon \
            --stacktrace

      # ── 3. Verify signature + warn if the RSA key secret is missing ────
      - name: Verify APK signature
        if: env.SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/bazaar/release/app-bazaar-release.apk"
          ls -lh "$APK"
          # WHAT THIS REPLACED: `jarsigner -verify … | grep -E "jar verified|WARNING|ERROR" || true`.
          # jarsigner only understands JAR (v1) signatures, while AGP signs a minSdk-26
          # release through the v2/v3 APK Signing Block, and the `|| true` swallowed the
          # exit status anyway — so the step printed nothing and could never fail, which is
          # worse than no step at all because the job reads as if signatures are covered.
          # apksigner is the tool that verifies those blocks, and it is deliberately
          # unwrapped: with `set -e` a missing or broken signature now ends the job.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::no apksigner under \$ANDROID_HOME/build-tools — not reporting an unverified APK as verified"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q "^Verifies" /tmp/apksigner.txt

          # KI#13 (CERT-PIN): verifying that the APK is signed says nothing about
          # WHO signed it. If the keystore secret were ever replaced (or a fork
          # built with its own key), this step used to pass happily. The
          # fingerprint is compared with a pinned value when that secret exists;
          # without it the run says so instead of pretending to have checked.
          if [ -n "${COMPRESSLY_CERT_SHA256:-}" ]; then
            ACTUAL=$(grep -oE 'certificate SHA-256 digest: [0-9a-fA-F]+' /tmp/apksigner.txt \
                     | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
            EXPECTED=$(printf '%s' "$COMPRESSLY_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
            if [ -z "$ACTUAL" ]; then
              echo "::error::apksigner printed no certificate digest — cannot pin."
              exit 1
            fi
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::APK is signed by $ACTUAL, but COMPRESSLY_CERT_SHA256 pins $EXPECTED."
              exit 1
            fi
            echo "certificate fingerprint matches the pinned COMPRESSLY_CERT_SHA256"
          else
            echo "::warning::COMPRESSLY_CERT_SHA256 is unset — signature verified, but not pinned to an expected key."
          fi
          if [ -z "${BAZAAR_RSA_KEY:-}" ]; then
            echo "::warning::BAZAAR_RSA_KEY secret is empty — Poolakey will refuse purchases at runtime (by design)."
          fi
          if [ -z "${ADIVERY_APP_ID:-}" ]; then
            echo "::warning::ADIVERY_APP_ID is not configured — this Bazaar build ships with the banner disabled (quiet placeholder slot)."
          fi

      # ── 4. Collect artifacts ───────────────────────────────────────────
      - name: Collect APK artifact
        run: |
          set -e
          # versionName is defined as "1.0.${versionCode}" in build.gradle.kts,
          # so grepping the literal string would capture "1.0.${versionCode}"
          # (the filename hack above produced "1.0.${versionCode}" on disk).
          # Resolve it from the numeric versionCode to mirror the build.
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VERSION="1.0.${VERSION_CODE:-0}"
          BUILD_NUM="${{ github.run_number }}"
          mkdir -p dist
          if [ "${SIGNING_ENABLED:-false}" = "true" ]; then
            cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk \
               "dist/Hajmino-${VERSION}-build${BUILD_NUM}-bazaar.apk"
          else
            cp app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk \
               "dist/Hajmino-${VERSION}-build${BUILD_NUM}-bazaar-DEBUG-unsigned.apk"
            echo "::warning::Artifact is a DEBUG build: no signing secrets are configured for this repository."
          fi
          ls -lh dist/
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      # ── 5. Upload ──────────────────────────────────────────────────────
      - name: Upload Bazaar APK
        uses: actions/upload-artifact@v6
        with:
          name: compressly-apks-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30


  # ── Device smoke tests (emulator) ───────────────────────────────────
  # E4 (DEVICE-JOB): app/src/androidTest held six instrumented suites that NO
  # workflow ever ran — the accessibility scan, the screenshot regression, the
  # i18n resource check and the real MediaCodec/MediaStore smoke paths were all
  # written, committed and dead. G3 closed the last part of that: the
  # accessibility scan and the screenshot regression are in the class list below
  # and the screenshot test captures the frames itself (UiDevice.takeScreenshot)
  # instead of waiting for a host loop that never existed. H2 added the API 28
  # leg so the legacy WRITE_EXTERNAL_STORAGE publish path is exercised too.
  #
  # continue-on-error is TRUE on purpose, and the honest reason is recorded
  # here: the UI-driving suites (MainFlowE2E, AccessibilityScan, Screenshot)
  # depend on emulator timing, and turning flaky red into a blocked release
  # would push people to skip the gate entirely. The suite runs, reports, and
  # uploads its results; flip this to false once it has been green for a few
  # runs (tracked in docs/KNOWN_ISSUES.md #11).
  device-tests:
    name: Device tests (API ${{ matrix.api-level }} emulator)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 50
    # H2 (test gap): the transcoder / MediaStore / replace-in-place paths are the
    # riskiest code in the app and only a real runtime can execute them. Two API
    # levels on purpose: 28 is the last release where the legacy
    # WRITE_EXTERNAL_STORAGE path (publish into EXTERNAL_CONTENT_URI) runs at all,
    # 33 is where the scoped-storage + consent path runs. A break on either is a
    # different bug, and only a matrix can tell them apart.
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 28]
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Extra storage: MediaStore test rows need room on the primary volume.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # One line on purpose: the runner passes this string to `sh -c`, and
          # a trailing backslash here produced a stray "\" argument
          # ("Task '\' not found") instead of a line continuation.
          script: ./gradlew :app:connectedBazaarDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.compressly.PhotoAudioSmokeTest,com.compressly.VideoTranscodeSmokeTest,com.compressly.MediaStorePublishTest,com.compressly.I18nSanityTest,com.compressly.ComposeAccessibilityScanTest,com.compressly.ScreenshotRegressionTest --no-daemon --stacktrace

      # G3: the accessibility and screenshot suites now actually run, so their
      # evidence has to survive the job — a failing a11y scan is only useful if
      # the tree it complained about is readable.
      - name: Collect UI evidence
        if: always()
        run: |
          adb shell run-as ir.siliksama.hajmino.debug ls 2>/dev/null || true
          adb pull /sdcard/Android/data/ir.siliksama.hajmino.debug/files/screenshots \
            ./screenshots || true
          # The debug applicationId carries the -debug suffix (E7), and older
          # installs used the unsuffixed id.
          adb pull /sdcard/Android/data/ir.siliksama.hajmino/files/screenshots \
            ./screenshots-legacy || true

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: device-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            screenshots/
            screenshots-legacy/
          if-no-files-found: ignore
          retention-days: 7

  # ── H3: the performance harness must not rot ─────────────────────────
  # docs/BENCHMARK.md says it plainly: the publishable TTID numbers have to come
  # from a physical device, so this job does NOT gate a release on a number. What
  # it does gate is the harness itself — the macrobenchmark module had never been
  # executed anywhere, so a rename or a broken selector could sit in the repo for
  # months unnoticed.
  benchmark:
    name: Macrobenchmark harness (emulator, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run startup benchmarks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The module is a com.android.test module with app-matching flavors, so
          # the connected task name depends on the variant it resolves
          # (connectedBazaarDebugAndroidTest here, not ...BenchmarkAndroidTest).
          # Ask Gradle instead of hardcoding a name that does not exist.
          script: |
            TASK=$(./gradlew :benchmark:tasks --all --no-daemon --quiet | grep -Eo 'connected[A-Za-z]+AndroidTest' | head -1 || true)
            echo "benchmark connected task: '${TASK}'"
            if [ -z "$TASK" ]; then
              # This module is a self-instrumenting com.android.test module, so it
              # does not always expose a connected task. Saying so is the honest
              # outcome; the harness is still CONFIGURED and COMPILED by the build
              # job, and the numbers that go into docs/BENCHMARK.md have to come
              # from a physical device anyway.
              echo "::notice::no connected benchmark task in :benchmark — harness compiled only (docs/BENCHMARK.md)."
              ./gradlew :benchmark:tasks --all --no-daemon --quiet > /dev/null
              exit 0
            fi
            ./gradlew ":benchmark:$TASK" --no-daemon --stacktrace

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-output
          path: |
            benchmark/build/outputs/
            benchmark/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  # ── Security audit (HARD gate now) ──────────────────────────────────
  # The signing keystore + password were previously committed/public and are
  # now COMPROMISED; a fresh keystore lives only in repo secrets and the build
  # reads credentials only from env (no fallback). This job is now a gate: if a
  # keystore, a hardcoded password, or a private-key literal is ever tracked
  # again, the build fails.
  security:
    name: Security audit (keystore / secrets)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      # fetch-depth: 0 is required, not optional: the point of this job is to see
      # material that was *deleted* at HEAD, and a shallow checkout cannot.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        shell: bash
        run: |
          # NOTE: deliberately no `set -e`; the `git ls-files | while ...` pipe
          # makes the script's exit status that of the LAST command, which is
          # unreliable as a gate. We count findings and exit explicitly.
          FAIL=0
          echo "== tracked keystore =="
          K=$(git ls-files | grep -Ei '\.(jks|keystore|p12|pfx)$' || true)
          if [ -n "$K" ]; then echo "::error::A signing keystore is tracked in git: $K"; FAIL=1; else echo "OK: no keystore tracked"; fi
          # E2 (GATE-FIX): the old expression combined grep -R with a file
          # argument and required `getenv(...) ?: "literal"` on ONE line filtered
          # by another grep — it could not match the real file shape, so the gate
          # was decorative. These two patterns are the actual failure modes:
          #  · any `getenv(...) ?: "literal"` default, whatever the variable name
          #  · a quoted literal assigned to a signing credential
          echo "== hardcoded signing password =="
          if grep -nE 'getenv\([^)]*\)[[:space:]]*\?:[[:space:]]*"[^"]+"' app/build.gradle.kts; then
            echo "::error::Environment credential with a hardcoded literal fallback"; FAIL=1
          fi
          if grep -nEi '(storePassword|keyPassword|storePass|keyPass)[[:space:]]*=[[:space:]]*"' app/build.gradle.kts; then
            echo "::error::Hardcoded signing credential"; FAIL=1
          fi
          if [ "$FAIL" -eq 0 ]; then echo "OK: no hardcoded password or fallback"; fi
          echo "== private-key literals =="
          if git grep -lEI 'BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY' ; then echo "::error::A private-key literal was found"; FAIL=1; else echo "OK: no private-key literals"; fi
          echo "== large tracked blobs (>500 KB) =="
          # NOTE: the `if` form is required — `[ cond ] && echo` returns 1 for a
          # non-large file, and GitHub's `bash -e -o pipefail` then kills the
          # whole step. `if` always returns 0.
          git ls-files | while read -r f; do [ -f "$f" ] || continue; S=$(stat -c%s "$f" 2>/dev/null || echo 0); if [ "$S" -gt 500000 ]; then echo "$f ($S bytes)"; fi; done
          if [ "$FAIL" -eq 0 ]; then echo "SECURITY AUDIT PASSED"; exit 0; else echo "SECURITY AUDIT FAILED"; exit 1; fi

      # HISTORY — advisory on purpose. Everything below is clean at HEAD, but the
      # two .jks files and the plaintext passwords that signed them are still
      # reachable in old commits (docs/KNOWN_ISSUES.md #9). Making this a hard gate
      # today would only ever report a known, user-side task, so it warns; flip the
      # trailing `exit 0` to `exit 1` right after the history is purged (git
      # filter-repo / BFG + GitHub's cache purge) so a new key can never leak again.
      - name: Scan git history for signing material
        shell: bash
        run: |
          HITS=$(git log --all --diff-filter=A --name-only --pretty=format: | grep -Ei '\.(jks|keystore|p12|pfx)$' | sort -u || true)
          if [ -n "$HITS" ]; then
            echo "$HITS" | sed 's/^/  found in history: /'
            echo "::warning::Keystore files are reachable in git history — purge history, rotate the signing key, and confirm the CI secret is the new key (docs/KNOWN_ISSUES.md #9)."
            printf '%s\n' "$HITS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OK: no keystore anywhere in history"
          fi
          exit 0

  # ── Lint — static quality gate ───────────────────────────────────────
  # Lint is now a HARD gate: abortOnError=true in build.gradle.kts and this
  # job no longer continues-on-error, so HardcodedText, missing
  # contentDescription and resource issues break the build on every push
  # instead of silently shipping.
  lint:
    name: Lint gate (bazaar debug)
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 30
    # Same rule as the workflow-level concurrency: never cancel a run that is
    # already working. `group: lint` + cancel-in-progress used to let a doc-only
    # push kill an in-flight lint job, which turned a whole green-shaped run into
    # "cancelled" and could destroy the only evidence that lint had found something.
    concurrency:
      group: lint-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Runs first and needs no JDK/Gradle: the syntax gate that would have caught
      # the five red commits (an unclosed nested block comment inside a KDoc made
      # the compiler swallow whole files, so nothing downstream was ever checked).
      # ~1 second, and it names the file and the cause instead of burying it in
      # Gradle output.
      - name: Kotlin lexer + resource reference gate
        run: python3 tools/kt_grammar_check.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      # E3 (LINT-COVERAGE): only one variant was linted, so a problem that shows
      # up in the play flavor (or in a release-only res/proguard configuration)
      # could reach the store unseen. Both flavors are linted now; the release
      # variant additionally checks the R8/ProGuard setup.
      - name: Run lint (bazaar debug)
        run: ./gradlew :app:lintBazaarDebug --no-daemon --stacktrace

      - name: Run lint (play debug)
        run: ./gradlew :app:lintPlayDebug --no-daemon --stacktrace

      - name: Run lint (bazaar release) — proguard/R8 configuration
        run: ./gradlew :app:lintBazaarRelease --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: app/build/reports
          if-no-files-found: ignore
          retention-days: 7
