name: Build & Test APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # One place to change the JVM sizing for every job.
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
    -Dorg.gradle.workers.max=2 -Dfile.encoding=UTF-8

jobs:
  # ── Universal APK ──────────────────────────────────────────────────────
  # A single signed release APK that installs on any Android 8.0+ device:
  # every ABI and every density in one file (the app declares no splits), and
  # no store-specific SDK - no Cafe Bazaar IAP, no ad network. This is the
  # build to hand to a tester or sideload directly.
  universal:
    name: Universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Gate: never publish an APK from a tree whose tests are red.
      - name: Run JVM unit tests
        run: ./gradlew :app:testPlayDebugUnitTest --no-daemon --stacktrace

      - name: Build universal release APK
        run: ./gradlew :app:assemblePlayRelease --no-daemon --stacktrace

      - name: Verify the APK is signed and truly universal
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/play/release/app-play-release.apk"
          test -f "$APK" || { echo "APK not produced"; exit 1; }

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "=== Using build-tools: $BT ==="

          echo "--- signature ---"
          "$BT/apksigner" verify --print-certs --verbose "$APK" | head -12

          echo "--- badging ---"
          "$BT/aapt" dump badging "$APK" \
            | grep -E "^package|^sdkVersion|^targetSdkVersion|^native-code|^densities" || true

          echo "--- ABIs inside the APK ---"
          # No `native-code` line above means the APK carries no split-only
          # native libs; list whatever is present so a future split is visible.
          unzip -l "$APK" | awk '/lib\//{print $4}' | cut -d/ -f2 | sort -u || true

          echo "--- no split metadata (a universal APK must not be a split) ---"
          if unzip -l "$APK" | grep -q "META-INF/.*\.kotlin_module.*split"; then
            echo "unexpected split metadata"; exit 1
          fi
          echo "OK: single self-contained APK"

      - name: Collect artifact
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          mkdir -p dist
          cp app/build/outputs/apk/play/release/app-play-release.apk \
             "dist/Compressly-${VERSION}-universal.apk"
          ls -lh dist/
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Compressly-universal-apk
          path: |
            dist/Compressly-*-universal.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  # ── Store builds ───────────────────────────────────────────────────────
  build:
    name: Test + Build signed APKs
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. JDK ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Gradle cache ────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 4. Validate Gradle wrapper ─────────────────────────────────────
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # ── 5. JVM unit tests ──────────────────────────────────────────────
      # Run tests on the bazaar/debug variant so the Poolakey source set
      # is also compiled and validated. The unit-test suite is pure-JVM
      # (MediaUtil, SizeEstimator, PresetDefaults, JobControl …) so it
      # needs no emulator.
      - name: Run JVM unit tests
        run: |
          ./gradlew \
            :app:testBazaarDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

      # ── 6. Build Bazaar release APK ────────────────────────────────────
      - name: Build Bazaar release APK
        run: |
          ./gradlew \
            :app:assembleBazaarRelease \
            --no-daemon \
            --stacktrace

      # ── 7. Build Play release APK ──────────────────────────────────────
      - name: Build Play release APK
        run: |
          ./gradlew \
            :app:assemblePlayRelease \
            --no-daemon \
            --stacktrace

      # ── 8. Verify APKs are signed ──────────────────────────────────────
      - name: Verify APK signatures
        run: |
          set -e
          BAZAAR_APK="app/build/outputs/apk/bazaar/release/app-bazaar-release.apk"
          PLAY_APK="app/build/outputs/apk/play/release/app-play-release.apk"

          for APK in "$BAZAAR_APK" "$PLAY_APK"; do
            echo "=== Verifying: $(basename $APK) ==="
            ls -lh "$APK"
            $JAVA_HOME/bin/jarsigner -verify -verbose "$APK" 2>&1 | \
              grep -E "jar verified|WARNING|ERROR" || true
          done

      # ── 9. Collect artifacts ───────────────────────────────────────────
      - name: Collect APK artifacts
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          BUILD_NUM="${{ github.run_number }}"
          mkdir -p dist

          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk \
             "dist/Hajmino-${VERSION}-build${BUILD_NUM}-bazaar.apk"

          cp app/build/outputs/apk/play/release/app-play-release.apk \
             "dist/Hajmino-${VERSION}-build${BUILD_NUM}-play.apk"

          echo "=== Artifacts ==="
          ls -lh dist/
          for f in dist/*.apk; do
            SIZE=$(stat -c%s "$f")
            echo "  $(basename $f): $(( SIZE / 1024 ))KB"
          done

      # ── 10. Upload artifacts ───────────────────────────────────────────
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: compressly-apks-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
