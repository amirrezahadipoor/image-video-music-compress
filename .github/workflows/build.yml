name: Build & Test Bazaar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # One place to change the JVM sizing for every job.
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
    -Dorg.gradle.workers.max=2 -Dfile.encoding=UTF-8
  BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
  # SIGNING: the release signing keystore + credentials come only from repo
  # secrets (the old committed .jks is COMPROMISED and removed). Exposed to
  # every job so `assembleBazaarRelease` can sign regardless of which job runs;
  # debug/lint/test jobs simply ignore them (build.gradle.kts populates the
  # signing config only when all four are present).
  COMPRESSLY_KEYSTORE_BASE64: ${{ secrets.COMPRESSLY_KEYSTORE_BASE64 }}
  COMPRESSLY_KEYSTORE_PASSWORD: ${{ secrets.COMPRESSLY_KEYSTORE_PASSWORD }}
  COMPRESSLY_KEY_ALIAS: ${{ secrets.COMPRESSLY_KEY_ALIAS }}
  COMPRESSLY_KEY_PASSWORD: ${{ secrets.COMPRESSLY_KEY_PASSWORD }}

jobs:
  # ── Bazaar build only ─────────────────────────────────────────────────
  # NO-PLAY-FIX: this app is published on Café Bazaar (Poolakey billing +
  # Adivery ads). The "play" flavor has no store billing and is only used for
  # local debugging, so the CI deliberately produces NO Google-Play APK —
  # only the signed Bazaar APK is built and uploaded.
  build:
    name: Test + Build signed Bazaar APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 1. JVM unit tests (bazaar/debug so the Poolakey source set is
      #    compiled and validated too). The suite is pure-JVM.
      - name: Run JVM unit tests
        run: |
          ./gradlew \
            :app:testBazaarDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

      # i18n key parity: every FA key has an EN counterpart and vice versa,
      # no blanks, no duplicate keys (static check on the real source files;
      # the I18nSanityTest covers the runtime side).
      - name: i18n key parity (fa <-> en)
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          def keys(path):
              root = ET.parse(path).getroot()
              ks = {}
              for s in root.findall("string"):
                  name = s.get("name")
                  assert name not in ks, f"duplicate key: {name}"
                  value = "".join(s.itertext()).strip()
                  assert value, f"blank value: {name}"
                  ks[name] = value
              return ks
          fa = keys("app/src/main/res/values/strings.xml")
          en = keys("app/src/main/res/values-en/strings.xml")
          only_fa = sorted(set(fa) - set(en))
          only_en = sorted(set(en) - set(fa))
          assert not only_fa and not only_en, f"fa-only={only_fa} en-only={only_en}"
          print(f"i18n parity OK: {len(fa)} keys in both languages")
          PY

      # ── 2. Materialise the signing keystore (from the base64 secret) so the
      #       release APK can be signed. The keystore + credentials are never in
      #       git; they come only from repo secrets. If the secret is missing the
      #       release build fails loudly (no fallback).
      - name: Materialise signing keystore
        run: |
          if [ -z "$COMPRESSLY_KEYSTORE_BASE64" ]; then
            echo "::warning::COMPRESSLY_KEYSTORE_BASE64 secret is empty — the release APK will be unsigned/skip signing."
          else
            mkdir -p "$HOME/.gradle/compressly"
            echo "$COMPRESSLY_KEYSTORE_BASE64" | base64 -d > "$HOME/.gradle/compressly/hajmino-signing.jks"
            echo "COMPRESSLY_KEYSTORE_FILE=$HOME/.gradle/compressly/hajmino-signing.jks" >> "$GITHUB_ENV"
            echo "signing keystore materialised: $(stat -c%s "$HOME/.gradle/compressly/hajmino-signing.jks") bytes"
          fi

      # ── 3. Build the Bazaar release APK ────────────────────────────────
      - name: Build Bazaar release APK
        run: |
          ./gradlew \
            :app:assembleBazaarRelease \
            --no-daemon \
            --stacktrace

      # ── 3. Verify signature + warn if the RSA key secret is missing ────
      - name: Verify APK signature
        run: |
          set -e
          APK="app/build/outputs/apk/bazaar/release/app-bazaar-release.apk"
          ls -lh "$APK"
          $JAVA_HOME/bin/jarsigner -verify -verbose "$APK" 2>&1 | \
            grep -E "jar verified|WARNING|ERROR" || true
          if [ -z "$BAZAAR_RSA_KEY" ]; then
            echo "::warning::BAZAAR_RSA_KEY secret is empty — Poolakey will refuse purchases at runtime (by design)."
          fi

      # ── 4. Collect artifacts ───────────────────────────────────────────
      - name: Collect APK artifact
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          BUILD_NUM="${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk \
             "dist/Hajmino-${VERSION}-build${BUILD_NUM}-bazaar.apk"
          ls -lh dist/
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      # ── 5. Upload ──────────────────────────────────────────────────────
      - name: Upload Bazaar APK
        uses: actions/upload-artifact@v6
        with:
          name: compressly-apks-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ── Emulator smoke test ────────────────────────────────────────────────
  # The only test that exercises the REAL MediaCodec pipeline (encoder
  # negotiation, the surface path, the muxer) — the JVM suite cannot reach
  # any of it. Independent from the APK build so a flaky emulator never
  # blocks delivery, but it runs on every push and reports red when the
  # engine breaks on an actual Android runtime.
  instrumented:
    name: Emulator tests (engine + E2E + visual regression)
    runs-on: ubuntu-latest
    # contents:write — the first screenshot capture commits the visual
    # regression baseline (same pattern as the profile auto-commit).
    permissions:
      contents: write
    timeout-minutes: 75
    concurrency:
      group: instrumented
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # PASS 1 — FRESH install: screenshot capture. Independent from passes 2/3.
      - name: Pass 1 - screenshot capture (fresh install)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:installBazaarDebug --no-daemon
            # CI emulators boot slowly (SwiftShader). Wait for a fully-booted
            # device before launching, or `am start` returns "Activity not started"
            # and the screenshot tests run empty.
            adb -s emulator-5554 wait-for-device || true
            until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 3; done
            adb -s emulator-5554 shell input keyevent 82 || true
            APP_PKG=""
            for i in $(seq 1 24); do
              APP_PKG=$(adb -s emulator-5554 shell pm list packages | grep siliksama | cut -d: -f2)
              [ -n "$APP_PKG" ] && break
              sleep 5
            done
            echo "installed package: ${APP_PKG:-NONE}"
            if [ -n "$APP_PKG" ]; then
              # Component launch (matches the .debug appId the connected tests use).
              adb -s emulator-5554 shell am start -W -n "$APP_PKG/com.compressly.MainActivity" || true
              sleep 120
              if adb -s emulator-5554 shell ps -A 2>/dev/null | grep -q "$APP_PKG"; then
                echo "warmup: app survived its first launch"
              else
                echo "warmup: app process died after first launch - crash log:"
                adb -s emulator-5554 logcat -d -b crash -t 200 || true
              fi
              adb -s emulator-5554 shell am force-stop "$APP_PKG" || true
            else
              echo "warmup: package never appeared"
              adb -s emulator-5554 shell pm list packages || true
            fi
            mkdir -p shots-run/caps shots-run/CompresslyScreenshots
            : > pass1-console.log
            (tail -f pass1-console.log) & TAIL_PID=$!
            (while :; do
               ts=$(date +%s%3N)
               f=shots-run/caps/frame-$ts.png
               if adb -s emulator-5554 exec-out screencap -p > "$f" 2>/dev/null; then
                 adb -s emulator-5554 shell "echo $ts > /data/local/tmp/compressly_frame_ts" 2>/dev/null
                 echo "COMPRESSLY-FRAME $ts $f" >> pass1-console.log
               fi
               sleep 1
             done) & CAP_PID=$!
            ./gradlew :app:connectedBazaarDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.compressly.ScreenshotRegressionTest --no-daemon >> pass1-console.log 2>&1
            GRADLE_RC=$?
            kill $CAP_PID $TAIL_PID 2>/dev/null
            wait $CAP_PID $TAIL_PID 2>/dev/null
            XML=$(find app/build/outputs/androidTest-results -name "TEST-*.xml" 2>/dev/null | head -1)
            echo "test xml: ${XML:-none}"
            grep -o "COMPRESSLY-WINDOW [^<]*" "$XML" 2>/dev/null | head -6
            python3 scripts/pick_frames.py "$XML" shots-run/caps shots-run/CompresslyScreenshots
            PICK_RC=$?
            adb -s emulator-5554 logcat -d -b crash -t 300 2>/dev/null | tee pass1-crash.log || true
            echo "captured screenshots:"
            ls -la shots-run/CompresslyScreenshots
            R=0
            [ $GRADLE_RC -ne 0 ] && R=1
            [ $PICK_RC -ne 0 ] && R=1
            exit $R

      - name: Show pulled screenshots
        if: always()
        run: |
          ls -la shots-run/CompresslyScreenshots || true

      - name: Visual regression (first capture commits the baseline, later runs pixel-diff)
        if: success()
        run: |
          pip install pillow --quiet
          BASE=docs/screenshots-baseline
          if [ ! -f "$BASE/02_home.png" ]; then
            mkdir -p "$BASE"
            cp shots-run/CompresslyScreenshots/*.png "$BASE"/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots-baseline
            git commit -m "test(ui): visual regression baseline (first CI capture)"
            git push
            echo "Baseline committed - the next run starts pixel-diffing."
          else
            python3 scripts/visual_diff.py
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: shots-run/CompresslyScreenshots
          if-no-files-found: ignore
          retention-days: 7

      # PASS 2 — FRESH app data: full E2E journey. Independent of passes 1/3.
      - name: Pass 2 - full E2E journey (fresh app data)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb -s emulator-5554 wait-for-device || true
            until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 3; done
            adb -s emulator-5554 shell input keyevent 82 || true
            adb -s emulator-5554 shell pm clear ir.siliksama.hajmino || adb -s emulator-5554 shell pm clear ir.siliksama.hajmino.debug
            ./gradlew --no-configuration-cache :app:connectedBazaarDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.compressly.MainFlowE2ETest --no-daemon

      # PASS 3 — engine smoke + batch e2e + a11y + i18n. Independent of passes 1/2.
      - name: Pass 3 - engine, batch, a11y, i18n
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb -s emulator-5554 wait-for-device || true
            until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 3; done
            adb -s emulator-5554 shell input keyevent 82 || true
            adb -s emulator-5554 shell pm clear ir.siliksama.hajmino || adb -s emulator-5554 shell pm clear ir.siliksama.hajmino.debug
            ./gradlew --no-configuration-cache :app:connectedBazaarDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.compressly.PhotoBatchE2ETest,com.compressly.PhotoAudioSmokeTest,com.compressly.VideoTranscodeSmokeTest,com.compressly.ComposeAccessibilityScanTest,com.compressly.I18nSanityTest --no-daemon

      - name: Upload instrumented results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: instrumented-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── Security audit (HARD gate now) ──────────────────────────────────
  # The signing keystore + password were previously committed/public and are
  # now COMPROMISED; a fresh keystore lives only in repo secrets and the build
  # reads credentials only from env (no fallback). This job is now a gate: if a
  # keystore, a hardcoded password, or a private-key literal is ever tracked
  # again, the build fails.
  security:
    name: Security audit (keystore / secrets)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6
      - name: Scan for committed secrets
        shell: bash
        run: |
          # NOTE: deliberately no `set -e`; the `git ls-files | while ...` pipe
          # makes the script's exit status that of the LAST command, which is
          # unreliable as a gate. We count findings and exit explicitly.
          FAIL=0
          echo "== tracked keystore =="
          K=$(git ls-files | grep -Ei '\.(jks|keystore|p12|pfx)$' || true)
          if [ -n "$K" ]; then echo "::error::A signing keystore is tracked in git: $K"; FAIL=1; else echo "OK: no keystore tracked"; fi
          echo "== hardcoded signing password =="
          if grep -RniE 'system\.getenv\([^)]*\)\s*\?:\s*"[^"]+"' app/build.gradle.kts | grep -qiE 'password|pass|key'; then
            echo "::error::Hardcoded signing password fallback present"; FAIL=1
          else
            echo "OK: no hardcoded password fallback"
          fi
          echo "== private-key literals =="
          if git grep -lEI 'BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY' ; then echo "::error::A private-key literal was found"; FAIL=1; else echo "OK: no private-key literals"; fi
          echo "== large tracked blobs (>500 KB) =="
          # NOTE: the `if` form is required — `[ cond ] && echo` returns 1 for a
          # non-large file, and GitHub's `bash -e -o pipefail` then kills the
          # whole step. `if` always returns 0.
          git ls-files | while read -r f; do [ -f "$f" ] || continue; S=$(stat -c%s "$f" 2>/dev/null || echo 0); if [ "$S" -gt 500000 ]; then echo "$f ($S bytes)"; fi; done
          if [ "$FAIL" -eq 0 ]; then echo "SECURITY AUDIT PASSED"; exit 0; else echo "SECURITY AUDIT FAILED"; exit 1; fi

  # ── Lint — static quality gate ───────────────────────────────────────
  # Lint is now a HARD gate: abortOnError=true in build.gradle.kts and this
  # job no longer continues-on-error, so HardcodedText, missing
  # contentDescription and resource issues break the build on every push
  # instead of silently shipping.
  lint:
    name: Lint gate (bazaar debug)
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 30
    concurrency:
      group: lint
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run lint (bazaar debug)
        run: ./gradlew :app:lintBazaarDebug --no-daemon

      # Diagnostic (round 4): dump the androidTest compile classpath so we
      # can see exactly which artifacts the instrumented test scope sees.
      - name: Dump androidTest compile classpath (diagnostic)
        run: |
          ./gradlew :app:dependencies --configuration bazaarDebugAndroidTestCompileClasspath --no-daemon > androidtest-deps.txt || true
          grep -E "ui-test|compose.ui:ui|androidx.compose|project :app" androidtest-deps.txt | head -40

      - name: Upload lint report + classpath dump
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: |
            app/build/reports
            androidtest-deps.txt
          if-no-files-found: ignore
          retention-days: 7
  # ── Baseline Profile — generated and COMMITTED on a real Android runtime ──
  # AUTO-COMMIT: when the measured profile differs from the committed one it
  # is committed straight to main by the workflow bot, so the NEXT build ships
  # it (no manual artifact downloading). The commit triggers a new run where
  # the job finds no changes and exits quietly. Never blocks the Bazaar build
  # below.
  baseline-profile:
    name: Generate + commit Baseline Profile (managed device)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    concurrency:
      group: baseline-profile
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Materialise signing keystore
        run: |
          if [ -z "$COMPRESSLY_KEYSTORE_BASE64" ]; then
            echo "::warning::COMPRESSLY_KEYSTORE_BASE64 secret is empty — baseline profile build may not sign."
          else
            mkdir -p "$HOME/.gradle/compressly"
            echo "$COMPRESSLY_KEYSTORE_BASE64" | base64 -d > "$HOME/.gradle/compressly/hajmino-signing.jks"
            echo "COMPRESSLY_KEYSTORE_FILE=$HOME/.gradle/compressly/hajmino-signing.jks" >> "$GITHUB_ENV"
            echo "signing keystore materialised: $(stat -c%s "$HOME/.gradle/compressly/hajmino-signing.jks") bytes"
          fi

      - name: Generate Baseline Profile
        run: |
          ./gradlew :app:generateBaselineProfile --no-daemon --stacktrace \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Strip Sentry lines (R8 landmine)
        if: success()
        run: |
          # The Adivery ad SDK pulls in io.sentry transitively; a measured
          # profile records sentry's hot methods, and R8's profile-guided
          # unused-argument optimization then fails the bazaar RELEASE build
          # (first hit in run 33596042703, fixed in 4ea03ac by hand). Sentry
          # hotness is irrelevant to app startup, so keep the auto-commit
          # from re-introducing the landmine on every profile refresh.
          sed -i '/sentry/d' app/src/main/generated/baselineProfiles/*.txt

      - name: Auto-commit the refreshed profile
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code -- app/src/main/generated/; then
            echo "profile unchanged — nothing to commit"
          else
            git add app/src/main/generated/
            git commit -m "chore(perf): refresh measured Baseline Profile"
            git push origin main
            echo "refreshed profile committed and pushed"
          fi
