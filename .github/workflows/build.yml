name: Build & Test Bazaar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # One place to change the JVM sizing for every job.
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
    -Dorg.gradle.workers.max=2 -Dfile.encoding=UTF-8
  BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}

jobs:
  # ── Bazaar build only ─────────────────────────────────────────────────
  # NO-PLAY-FIX: this app is published on Café Bazaar (Poolakey billing +
  # Adivery ads). The "play" flavor has no store billing and is only used for
  # local debugging, so the CI deliberately produces NO Google-Play APK —
  # only the signed Bazaar APK is built and uploaded.
  build:
    name: Test + Build signed Bazaar APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 1. JVM unit tests (bazaar/debug so the Poolakey source set is
      #    compiled and validated too). The suite is pure-JVM.
      - name: Run JVM unit tests
        run: |
          ./gradlew \
            :app:testBazaarDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

      # i18n key parity: every FA key has an EN counterpart and vice versa,
      # no blanks, no duplicate keys (static check on the real source files;
      # the I18nSanityTest covers the runtime side).
      - name: i18n key parity (fa <-> en)
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          def keys(path):
              root = ET.parse(path).getroot()
              ks = {}
              for s in root.findall("string"):
                  name = s.get("name")
                  assert name not in ks, f"duplicate key: {name}"
                  value = "".join(s.itertext()).strip()
                  assert value, f"blank value: {name}"
                  ks[name] = value
              return ks
          fa = keys("app/src/main/res/values/strings.xml")
          en = keys("app/src/main/res/values-en/strings.xml")
          only_fa = sorted(set(fa) - set(en))
          only_en = sorted(set(en) - set(fa))
          assert not only_fa and not only_en, f"fa-only={only_fa} en-only={only_en}"
          print(f"i18n parity OK: {len(fa)} keys in both languages")
          PY

      # ── 2. Build the Bazaar release APK ────────────────────────────────
      - name: Build Bazaar release APK
        run: |
          ./gradlew \
            :app:assembleBazaarRelease \
            --no-daemon \
            --stacktrace

      # ── 3. Verify signature + warn if the RSA key secret is missing ────
      - name: Verify APK signature
        run: |
          set -e
          APK="app/build/outputs/apk/bazaar/release/app-bazaar-release.apk"
          ls -lh "$APK"
          $JAVA_HOME/bin/jarsigner -verify -verbose "$APK" 2>&1 | \
            grep -E "jar verified|WARNING|ERROR" || true
          if [ -z "$BAZAAR_RSA_KEY" ]; then
            echo "::warning::BAZAAR_RSA_KEY secret is empty — Poolakey will refuse purchases at runtime (by design)."
          fi

      # ── 4. Collect artifacts ───────────────────────────────────────────
      - name: Collect APK artifact
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          BUILD_NUM="${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk \
             "dist/Hajmino-${VERSION}-build${BUILD_NUM}-bazaar.apk"
          ls -lh dist/
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      # ── 5. Upload ──────────────────────────────────────────────────────
      - name: Upload Bazaar APK
        uses: actions/upload-artifact@v6
        with:
          name: compressly-apks-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ── Emulator smoke test ────────────────────────────────────────────────
  # The only test that exercises the REAL MediaCodec pipeline (encoder
  # negotiation, the surface path, the muxer) — the JVM suite cannot reach
  # any of it. Independent from the APK build so a flaky emulator never
  # blocks delivery, but it runs on every push and reports red when the
  # engine breaks on an actual Android runtime.
  instrumented:
    name: Emulator tests (engine + E2E + visual regression)
    runs-on: ubuntu-latest
    # contents:write — the first screenshot capture commits the visual
    # regression baseline (same pattern as the profile auto-commit).
    permissions:
      contents: write
    timeout-minutes: 75
    concurrency:
      group: instrumented
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # PASS 1 — FRESH install: screenshot capture (onboarding/home/history
      # need a first-run app, so they run before anything completes
      # onboarding).
      - name: Pass 1 - screenshot capture (fresh install)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:installBazaarDebug --no-daemon; APP_PKG=""; for i in $(seq 1 24); do APP_PKG=$(adb -s emulator-5554 shell pm list packages | grep siliksama | cut -d: -f2); [ -n "$APP_PKG" ] && break; sleep 5; done; echo "installed package: ${APP_PKG:-NONE}"; if [ -n "$APP_PKG" ]; then adb -s emulator-5554 shell am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$APP_PKG" || true; sleep 120; if adb -s emulator-5554 shell ps -A 2>/dev/null | grep -q "$APP_PKG"; then echo "warmup: app survived its first launch"; else echo "warmup: app process died after first launch — crash log:"; adb -s emulator-5554 logcat -d -b crash -t 200 || true; fi; adb -s emulator-5554 shell am force-stop "$APP_PKG" || true; else echo "warmup: package never appeared"; adb -s emulator-5554 shell pm list packages || true; fi; mkdir -p shots-run/CompresslyScreenshots; (while :; do t=$(adb -s emulator-5554 shell getprop compressly.snap_target 2>/dev/null | tr -d '\r'); case "$t" in 01_onboarding) adb -s emulator-5554 exec-out screencap -p > shots-run/CompresslyScreenshots/01_onboarding.png 2>/dev/null && adb -s emulator-5554 shell setprop compressly.snap_target done;; 02_home) adb -s emulator-5554 exec-out screencap -p > shots-run/CompresslyScreenshots/02_home.png 2>/dev/null && adb -s emulator-5554 shell setprop compressly.snap_target done;; 03_history) adb -s emulator-5554 exec-out screencap -p > shots-run/CompresslyScreenshots/03_history.png 2>/dev/null && adb -s emulator-5554 shell setprop compressly.snap_target done;; esac; sleep 0.3; done) & SNAP_PID=$!; ./gradlew :app:connectedBazaarDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.compressly.ScreenshotRegressionTest --no-daemon; GRADLE_RC=$?; kill $SNAP_PID 2>/dev/null; adb -s emulator-5554 shell setprop compressly.snap_target done 2>/dev/null; adb -s emulator-5554 logcat -d -b crash -t 300 2>/dev/null | tee pass1-crash.log || true; echo "captured screenshots:"; ls -la shots-run/CompresslyScreenshots; exit $GRADLE_RC

      - name: Show pulled screenshots
        if: success()
        run: |
          # Pulled inside the emulator-runner script (the emulator is gone
          # by the time this step runs).
          ls -la shots-run/CompresslyScreenshots || true

      - name: Visual regression (first capture commits the baseline, later runs pixel-diff)
        if: success()
        run: |
          pip install pillow --quiet
          BASE=docs/screenshots-baseline
          if [ ! -f "$BASE/02_home.png" ]; then
            mkdir -p "$BASE"
            cp shots-run/CompresslyScreenshots/*.png "$BASE"/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots-baseline
            git commit -m "test(ui): visual regression baseline (first CI capture)"
            git push
            echo "Baseline committed - the next run starts pixel-diffing."
          else
            python3 scripts/visual_diff.py
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

      # PASS 2 — FRESH app data: the full E2E journey starts from
      # onboarding, which requires first-run state.
      - name: Pass 2 - full E2E journey (fresh app data)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb -s emulator-5554 shell pm clear ir.siliksama.hajmino || adb -s emulator-5554 shell pm clear ir.siliksama.hajmino.debug
            ./gradlew --no-configuration-cache :app:connectedBazaarDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.compressly.MainFlowE2ETest --no-daemon

      # PASS 3 — engine smoke + batch e2e + a11y scan + i18n runtime.
      - name: Pass 3 - engine, batch, a11y, i18n
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb -s emulator-5554 shell pm clear ir.siliksama.hajmino || adb -s emulator-5554 shell pm clear ir.siliksama.hajmino.debug
            ./gradlew --no-configuration-cache :app:connectedBazaarDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.compressly.PhotoBatchE2ETest,com.compressly.PhotoAudioSmokeTest,com.compressly.VideoTranscodeSmokeTest,com.compressly.ComposeAccessibilityScanTest,com.compressly.I18nSanityTest --no-daemon

      - name: Upload instrumented results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: instrumented-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── Lint — static quality gate (non-gating for now) ───────────────────
  # Wired in as a REPORT first (measure, then gate — same pattern as the
  # macrobenchmark trend). Once the report is clean this flips to a hard
  # gate: lint catches HardcodedText, missing contentDescription and
  # resource issues statically, on every push.
  lint:
    name: Lint report (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    concurrency:
      group: lint
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run lint (bazaar debug)
        run: ./gradlew :app:lintBazaarDebug --no-daemon

      # Diagnostic (round 4): dump the androidTest compile classpath so we
      # can see exactly which artifacts the instrumented test scope sees.
      - name: Dump androidTest compile classpath (diagnostic)
        run: |
          ./gradlew :app:dependencies --configuration bazaarDebugAndroidTestCompileClasspath --no-daemon > androidtest-deps.txt || true
          grep -E "ui-test|compose.ui:ui|androidx.compose|project :app" androidtest-deps.txt | head -40

      - name: Upload lint report + classpath dump
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: |
            app/build/reports
            androidtest-deps.txt
          if-no-files-found: ignore
          retention-days: 7
  # ── Baseline Profile — generated and COMMITTED on a real Android runtime ──
  # AUTO-COMMIT: when the measured profile differs from the committed one it
  # is committed straight to main by the workflow bot, so the NEXT build ships
  # it (no manual artifact downloading). The commit triggers a new run where
  # the job finds no changes and exits quietly. Never blocks the Bazaar build
  # below.
  baseline-profile:
    name: Generate + commit Baseline Profile (managed device)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    concurrency:
      group: baseline-profile
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate Baseline Profile
        run: |
          ./gradlew :app:generateBaselineProfile --no-daemon --stacktrace \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Strip Sentry lines (R8 landmine)
        if: success()
        run: |
          # The Adivery ad SDK pulls in io.sentry transitively; a measured
          # profile records sentry's hot methods, and R8's profile-guided
          # unused-argument optimization then fails the bazaar RELEASE build
          # (first hit in run 33596042703, fixed in 4ea03ac by hand). Sentry
          # hotness is irrelevant to app startup, so keep the auto-commit
          # from re-introducing the landmine on every profile refresh.
          sed -i '/sentry/d' app/src/main/generated/baselineProfiles/*.txt

      - name: Auto-commit the refreshed profile
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code -- app/src/main/generated/; then
            echo "profile unchanged — nothing to commit"
          else
            git add app/src/main/generated/
            git commit -m "chore(perf): refresh measured Baseline Profile"
            git push origin main
            echo "refreshed profile committed and pushed"
          fi
