name: Generate Baseline Profile (manual)

# Run on demand (Actions -> Generate Baseline Profile -> Run workflow).
# Generates the measured Baseline Profile on a Gradle-managed emulator and
# opens a PR with it, instead of just leaving it in an artifact. Merge the PR
# to ship the AOT-compiled cold start in the next release.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate and open a PR with the measured profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate Baseline Profile
        run: |
          ./gradlew :app:generateBaselineProfile --no-daemon --stacktrace \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet --exit-code -- app/src/main/generated/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Branch, push and open a PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ci/refresh-baseline-profile
          git add app/src/main/generated/
          git commit -m "chore(perf): refresh measured Baseline Profile"
          git push origin ci/refresh-baseline-profile
          gh pr create \
            --title "Refresh measured Baseline Profile" \
            --body "Generated by the 'Generate Baseline Profile' workflow on a Gradle-managed emulator. Merge to ship the AOT-compiled cold start in the next release." \
            --base main --head ci/refresh-baseline-profile || true
        env:
          GH_TOKEN: ${{ github.token }}
