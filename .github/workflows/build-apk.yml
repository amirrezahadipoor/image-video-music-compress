name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  build:
    name: Build APK (play + bazaar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Play release + Bazaar debug APKs
        run: ./gradlew :app:assemblePlayRelease :app:assembleBazaarDebug --stacktrace --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: compressly-apks
          path: |
            app/build/outputs/apk/play/release/*.apk
            app/build/outputs/apk/bazaar/debug/*.apk
          if-no-files-found: error
          retention-days: 30
