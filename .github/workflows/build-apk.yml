name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build universal signed APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests + build universal release APK
        run: |
          ./gradlew \
            :app:testBazaarReleaseUnitTest \
            :app:assembleBazaarRelease \
            --no-daemon

      - name: Prepare universal APK artifacts
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          mkdir -p dist
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk \
             "dist/Compressly-${VERSION}-bazaar.apk"
          ls -la dist/

      - name: Upload universal signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: compressly-universal-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
