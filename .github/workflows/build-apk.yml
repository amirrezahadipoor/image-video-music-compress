name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # manual runs from the Actions tab

jobs:
  build:
    name: Build universal signed APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build universal release APKs (play + bazaar)
        run: |
          ./gradlew \
            :app:assemblePlayRelease \
            :app:assembleBazaarRelease \
            --no-daemon

      - name: Restore release keystore (from secrets, if configured)
        env:
          KS_BASE64: ${{ secrets.COMPRESSLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > keystore.jks
            echo "Keystore restored from secrets."
          else
            echo "No keystore secret set; will use a throwaway test key."
          fi

      - name: Sign release APKs
        env:
          KS_PASS: ${{ secrets.COMPRESSLY_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.COMPRESSLY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.COMPRESSLY_KEY_PASSWORD }}
        run: |
          set -e
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias compressly \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass compressly2024 -keypass compressly2024 \
              -dname "CN=Compressly, OU=Mobile, O=Compressly, L=Tehran, C=IR" >/dev/null 2>&1
            KS_PASS="${KS_PASS:-compressly2024}"
            KS_ALIAS="${KS_ALIAS:-compressly}"
            KEY_PASS="${KEY_PASS:-compressly2024}"
          fi
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under \$ANDROID_HOME/build-tools"
            exit 1
          fi
          for apk in \
            app/build/outputs/apk/play/release/app-play-release-unsigned.apk \
            app/build/outputs/apk/bazaar/release/app-bazaar-release-unsigned.apk; do
            if [ -f "$apk" ]; then
              out="${apk%-unsigned.apk}-signed.apk"
              "$APKSIGNER" sign \
                --ks keystore.jks --ks-key-alias "${KS_ALIAS:-compressly}" \
                --ks-pass "pass:${KS_PASS:-compressly2024}" \
                --key-pass "pass:${KEY_PASS:-compressly2024}" \
                --out "$out" "$apk"
              echo "Signed: $out"
            fi
          done

      - name: Prepare universal APK artifacts
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          mkdir -p dist
          cp app/build/outputs/apk/play/release/app-play-release-signed.apk \
             "dist/Compressly-${VERSION}-play.apk"
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release-signed.apk \
             "dist/Compressly-${VERSION}-bazaar.apk"
          ls -la dist/

      - name: Upload universal signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: compressly-universal-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
