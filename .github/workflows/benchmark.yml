name: Macrobenchmark (cold-start trend)

# Isolated from the delivery pipeline. Startup measurement on a CI emulator
# is inherently flaky (boot timeouts, install flakes) and its value is a
# TREND, not a gate — so it lives in its own workflow:
#   - runs on push to main + nightly + manual dispatch,
#   - continue-on-error: a flake never tints the commit red,
#   - on SUCCESS it commits the measured TTID/TTFD into docs/BENCHMARK.md,
#     which is how the "20-30% faster with profile" claim becomes a tracked,
#     measured trend instead of an assertion.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macrobenchmark
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
    -Dorg.gradle.workers.max=2 -Dfile.encoding=UTF-8

jobs:
  benchmark:
    name: Cold-start TTID/TTFD
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run startup benchmarks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            # Self-instrumenting connected tests do NOT install the target
            # app automatically (macrobenchmark issue history) — install the
            # bazaar debug APK explicitly first.
            ./gradlew :app:installBazaarDebug --no-daemon
            # A cold-start measurement on a CI emulator is inherently noisy: a
            # single flaked sample (device-wait timeout, boot/thermal jitter)
            # costs the whole trend point. It is a TREND, not a pass/fail gate,
            # so retry once. NOTE: the emulator-runner action collapses the
            # multi-line script, so keep this a SINGLE line (no \ continuations,
            # no multi-line if/fi) — else sh gets an unterminated block.
            ./gradlew :benchmark:connectedBazaarDebugAndroidTest --no-daemon || ./gradlew :benchmark:connectedBazaarDebugAndroidTest --no-daemon

      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macrobenchmark-results
          path: benchmark/build/outputs
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit the measured numbers to the trend (docs/BENCHMARK.md)
        if: success()
        run: |
          python3 - <<'PY'
          import datetime, glob, os, sys
          import xml.etree.ElementTree as ET

          files = glob.glob("benchmark/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
          rows = {}
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for tc in root.iter("testcase"):
                  name = tc.get("name", "")
                  for m in tc.findall("metric"):
                      val = m.get("value")
                      if val is not None:
                          rows.setdefault((name, m.get("name")), []).append(float(val))
          if not rows:
              print("no macrobenchmark metrics found in the connected results")
              sys.exit(0)

          doc = "docs/BENCHMARK.md"
          text = open(doc, encoding="utf-8").read() if os.path.exists(doc) else "# Benchmark trend\n"
          table_header = (
              "\n## CI measurements (API 35 x86_64 emulator, 5 iterations, medians)\n\n"
              "| when (UTC) | test | metric | median (ms) |\n|---|---|---|---|\n"
          )
          if "|---|---|---|---|" not in text:
              text = text.rstrip() + "\n" + table_header
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M")
          lines = []
          for (test, metric), vals in sorted(rows.items()):
              vals.sort()
              lines.append(f"| {stamp} | {test} | {metric} | {vals[len(vals)//2]:.0f} |")
          text = text.rstrip() + "\n" + "\n".join(lines) + "\n"

          # Keep the table bounded but preserve a meaningful long-term trend:
          # retain the newest 240 data rows (about 6-7 months of nightly
          # runs) instead of only 40, so regressions do not age out of view.
          # A monthly aggregate could be added later if the table grows to
          # the point where the daily rows stop reading well.
          header_end = text.index("|---|---|---|---|") + len("|---|---|---|---|")
          header, data = text[:header_end], text[header_end:]
          rows_txt = [ln for ln in data.splitlines() if ln.startswith("|")]
          if len(rows_txt) > 240:
              text = header + "\n" + "\n".join(rows_txt[-240:]) + "\n"

          open(doc, "w", encoding="utf-8").write(text)
          for (test, metric), vals in sorted(rows.items()):
              vals.sort()
              print(f"{test} / {metric}: median {vals[len(vals)//2]:.0f} ms")
          PY
          if git diff --quiet --exit-code -- docs/BENCHMARK.md; then
            echo "No new numbers to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/BENCHMARK.md
            git commit -m "perf: refresh measured cold-start TTID/TTFD"
            git push
          fi
