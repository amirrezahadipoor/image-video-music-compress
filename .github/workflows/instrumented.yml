name: Instrumented smoke (MediaCodec)

# ONE minimal, isolated runtime signal for the MediaCodec pipeline — and
# nothing more. This is deliberately NOT the old hand-rolled 3-pass visual-diff
# emulator job: that was flaky (boot timeouts, screenshot drift) and was
# removed. This job:
#   - runs a single real device test (VideoTranscodeSmokeTest) that encodes a
#     tiny H.264 clip with the hardware codec and pushes it through the
#     production MediaCodecTranscoder — the one code path JVM tests can't reach,
#   - runs on ONE emulator (API 35 x86_64 google_apis) via the standard
#     android-emulator-runner action,
#   - is fully ISOLATED in its own workflow and continues-on-error, so a
#     transient emulator flake never tints the Test+Build commit red.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrumented
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
    -Dorg.gradle.workers.max=2 -Dfile.encoding=UTF-8

jobs:
  video-smoke:
    name: VideoTranscodeSmokeTest (single emulator)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the single MediaCodec smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            # Run ONLY the one instrumented MediaCodec test to keep this signal
            # minimal and fast; the rest of the androidTest suite (screenshot
            # regression, a11y scan) is out of scope for this job.
            ./gradlew :app:connectedBazaarDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.compressly.VideoTranscodeSmokeTest \
              --no-daemon --stacktrace

      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: instrumented-video-smoke
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
